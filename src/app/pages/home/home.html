<input type="file" id="input-file" (change)="onFileSelected($event)" accept=".csv">

<label for="input-file" class="button-customized">
  Choose file
</label>

<br><br>
@if (totalCount() > 0) {
  <div class="progress-track">
    <div 
      class="progress-fill" 
      [style.width.%]="percentage()"
      [style.background-color]="progressColor()">
    </div>
  </div>

  <p>{{ processedCount() }} / {{ totalCount() }} movies processed ({{ percentage() }}%)</p>
}
<br><br>

@if (stateService.movies().length > 0 && !stateService.stats_data()) {
  <p>{{ stateService.movies().length }} movies loaded</p>
  <button (click)="enrichMovies()" class="enrich-button" >Search movies information</button>
  
  <!--
  @for (movie of stateService.movies(); track movie.title + movie.release_year) {
    <li>{{ movie.title }}</li>
  }
  -->
}
